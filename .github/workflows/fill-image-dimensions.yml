name: Fill image dimensions
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'scripts/fill_image_dimensions.py'
      - '.github/workflows/fill-image-dimensions.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/fill_image_dimensions.py'
      - '.github/workflows/fill-image-dimensions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: image-dimensions-main
  cancel-in-progress: false
jobs:
  verify-image-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and image annotation
        run: |
          python3 -m py_compile scripts/fill_image_dimensions.py
          python3 scripts/fill_image_dimensions.py
          git diff --check
  annotate-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add natural dimensions to local images
        run: python3 scripts/fill_image_dimensions.py
      - name: Commit dimension attributes only if changed
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No missing local image dimensions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Add intrinsic dimensions to local portfolio images"
          git push
