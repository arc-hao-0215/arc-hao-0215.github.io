name: Import credited Dashan research photographs
on:
  push:
    paths:
      - '.github/workflows/import-ground-photographs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image tools
        run: python3 -m pip install --quiet requests pillow
      - name: Download Commons originals and export optimized WebP
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, time, pathlib, requests
          from PIL import Image, ImageOps
          from urllib.parse import quote
          photos = [
              ("dashan-coastline", "眺望大山堡壘-01.jpg"),
              ("fenggui-coast", "Penghu Fenggui Cave 01.jpg"),
              ("penghu-basalt", "Penghu basalt wall.jpg"),
              ("dashan-courtyard", "澎湖-馬公大山堡壘砲台3.jpg"),
              ("dashan-vaulted-exterior", "澎湖-馬公大山堡壘砲台.jpg"),
              ("dashan-vaulted-interior", "澎湖-馬公大山堡壘砲台2.jpg"),
              ("fenggui-landform", "Penghu Fenggui Cave 10.jpg"),
          ]
          out=pathlib.Path("assets/research-ground")
          out.mkdir(parents=True, exist_ok=True)
          sess=requests.Session()
          sess.headers.update({"User-Agent":"HaoChangArchitecturePortfolio/1.0 (https://arc-hao-0215.github.io/; attribution-oriented licensed media archive)"})
          for stem,name in photos:
              params={"action":"query","prop":"imageinfo","iiprop":"url","iiurlwidth":"1800","format":"json","titles":"File:"+name}
              result=sess.get("https://commons.wikimedia.org/w/api.php", params=params, timeout=35)
              result.raise_for_status()
              pages=result.json()["query"]["pages"]
              info=next(iter(pages.values())).get("imageinfo")
              if not info: raise RuntimeError("No commons image record for "+name)
              url=info[0].get("thumburl") or info[0]["url"]
              r=sess.get(url,timeout=70)
              r.raise_for_status()
              im=Image.open(io.BytesIO(r.content))
              im=ImageOps.exif_transpose(im).convert("RGB")
              if im.width>1680:
                  im.thumbnail((1680,1680), Image.Resampling.LANCZOS)
              fp=out/(stem+".webp")
              im.save(fp,"WEBP",quality=82,method=6)
              if fp.stat().st_size<5000: raise RuntimeError("Too small "+str(fp))
              print(fp, im.size, fp.stat().st_size, flush=True)
              time.sleep(1.2)
          PY
      - name: Commit uploaded photo assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-ground/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Store seven open-license Dashan research photographs locally"
            git push
          fi
